name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install Dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git build-essential cmake meson ninja-build pkg-config \
            libsdl3-dev libsdl3-ttf-dev libsdl3-image-dev libzip-dev \
            libfreeimage-dev glslc poppler-utils fonts-dejavu-core
      - uses: actions/checkout@v4
      - name: Configure
        run: meson setup builddir --buildtype=release -Dimage_backend=auto
      - name: Build
        run: meson compile -C builddir
      - name: Test
        run: meson test -C builddir --print-errorlogs
      - name: Create Release Archive
        run: |
          mkdir -p release
          cp builddir/ic README.md LICENSE release/
          tar -czf "ic-${GITHUB_REF_NAME}-linux.tar.gz" -C release .
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ic-${{ github.ref_name }}-linux.tar.gz
          body: |
            Release ${{ github.ref_name }}

            Linux x86_64 binary built on Ubuntu 26.04 using Meson.
            Requires SDL3, SDL3_ttf, SDL3_image, libzip, and FreeImage runtime libraries.
            PDF support uses Poppler utilities; CBR support requires unrar.
            The native archive does not bundle these dependencies.

            ```sh
            tar -xzf ic-${{ github.ref_name }}-linux.tar.gz
            ./ic <comic-file-or-directory>
            ```
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
