name: Build Linux Binary and AppImage

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    env:
      DEBIAN_FRONTEND: noninteractive
    strategy:
      fail-fast: false
      matrix:
        image_backend: [auto, sdl_image]
        sanitizer: [none]
        include:
          - image_backend: auto
            sanitizer: address,undefined
    steps:
      - name: Install Bootstrap Dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: bash scripts/ci-dependencies.sh
      - name: Configure
        run: >-
          meson setup builddir
          --buildtype=${{ matrix.sanitizer == 'none' && 'release' || 'debug' }}
          -Dimage_backend=${{ matrix.image_backend }}
          -Db_sanitize=${{ matrix.sanitizer }}
      - name: Build
        run: meson compile -C builddir
      - name: Test
        run: meson test -C builddir --print-errorlogs
      - name: Package Binary
        if: matrix.sanitizer == 'none'
        run: tar -czf "ic-linux-x86_64-${{ matrix.image_backend }}.tar.gz" -C builddir ic
      - name: Upload Binary
        if: matrix.sanitizer == 'none'
        uses: actions/upload-artifact@v4
        with:
          name: ic-linux-x86_64-${{ matrix.image_backend }}
          path: ic-linux-x86_64-${{ matrix.image_backend }}.tar.gz
          if-no-files-found: error
      - name: Install AppImage Tools
        if: matrix.image_backend == 'sdl_image' && matrix.sanitizer == 'none'
        run: bash scripts/appimage-tools.sh
      - name: Build AppImage
        if: matrix.image_backend == 'sdl_image' && matrix.sanitizer == 'none'
        env:
          VERSION: ${{ github.sha }}
        run: ./scripts/build-appimage.sh
      - name: Upload AppImage
        if: matrix.image_backend == 'sdl_image' && matrix.sanitizer == 'none'
        uses: actions/upload-artifact@v4
        with:
          name: ic-linux-x86_64-AppImage
          path: '*.AppImage'
          if-no-files-found: error
      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.image_backend }}-${{ matrix.sanitizer }}
          path: builddir/meson-logs/
          if-no-files-found: ignore
