name: Linux

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    env:
      DEBIAN_FRONTEND: noninteractive
    strategy:
      fail-fast: false
      matrix:
        image_backend: [auto, sdl_image]
        sanitizer: [none]
        include:
          - image_backend: auto
            sanitizer: address,undefined
    steps:
      - name: Install Dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git build-essential cmake meson ninja-build pkg-config \
            libsdl3-dev libsdl3-ttf-dev libsdl3-image-dev libzip-dev \
            libfreeimage-dev glslc poppler-utils fonts-dejavu-core
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          meson setup builddir --buildtype=debug
          -Dimage_backend=${{ matrix.image_backend }}
          -Db_sanitize=${{ matrix.sanitizer }}
      - name: Build
        run: meson compile -C builddir
      - name: Test
        run: meson test -C builddir --print-errorlogs
      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.image_backend }}-${{ matrix.sanitizer }}
          path: builddir/meson-logs/
          if-no-files-found: ignore
