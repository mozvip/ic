name: Build Linux Binary and AppImage

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    env:
      DEBIAN_FRONTEND: noninteractive
    strategy:
      fail-fast: false
      matrix:
        image_backend: [auto, sdl_image]
        sanitizer: [none]
        include:
          - image_backend: auto
            sanitizer: address,undefined
    steps:
      - name: Install Dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git build-essential cmake meson ninja-build pkg-config \
            libsdl3-dev libsdl3-ttf-dev libsdl3-image-dev libzip-dev \
            libfreeimage-dev glslc poppler-utils fonts-dejavu-core
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          meson setup builddir
          --buildtype=${{ matrix.sanitizer == 'none' && 'release' || 'debug' }}
          -Dimage_backend=${{ matrix.image_backend }}
          -Db_sanitize=${{ matrix.sanitizer }}
      - name: Build
        run: meson compile -C builddir
      - name: Test
        run: meson test -C builddir --print-errorlogs
      - name: Package Binary
        if: matrix.sanitizer == 'none'
        run: tar -czf "ic-linux-x86_64-${{ matrix.image_backend }}.tar.gz" -C builddir ic
      - name: Upload Binary
        if: matrix.sanitizer == 'none'
        uses: actions/upload-artifact@v4
        with:
          name: ic-linux-x86_64-${{ matrix.image_backend }}
          path: ic-linux-x86_64-${{ matrix.image_backend }}.tar.gz
          if-no-files-found: error
      - name: Install AppImage Tools
        if: matrix.image_backend == 'sdl_image' && matrix.sanitizer == 'none'
        run: |
          apt-get install -y --no-install-recommends curl imagemagick desktop-file-utils file
          mkdir -p "$RUNNER_TEMP/appimage-tools"
          curl --fail --location --retry 3 \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            --output "$RUNNER_TEMP/appimage-tools/linuxdeploy"
          curl --fail --location --retry 3 \
            https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage \
            --output "$RUNNER_TEMP/appimage-tools/linuxdeploy-plugin-appimage"
          chmod +x "$RUNNER_TEMP/appimage-tools/linuxdeploy" "$RUNNER_TEMP/appimage-tools/linuxdeploy-plugin-appimage"
          echo "$RUNNER_TEMP/appimage-tools" >> "$GITHUB_PATH"
      - name: Build AppImage
        if: matrix.image_backend == 'sdl_image' && matrix.sanitizer == 'none'
        env:
          VERSION: ${{ github.sha }}
        run: ./scripts/build-appimage.sh
      - name: Upload AppImage
        if: matrix.image_backend == 'sdl_image' && matrix.sanitizer == 'none'
        uses: actions/upload-artifact@v4
        with:
          name: ic-linux-x86_64-AppImage
          path: '*.AppImage'
          if-no-files-found: error
      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.image_backend }}-${{ matrix.sanitizer }}
          path: builddir/meson-logs/
          if-no-files-found: ignore
